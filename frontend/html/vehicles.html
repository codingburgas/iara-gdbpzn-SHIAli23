<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="vehicles.title">Автомобили</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/teams.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/i18n.css">
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <button id="menuBtn" class="menu-btn">
            <i class="fas fa-bars"></i>
        </button>
        <h1 class="topbar-title" data-i18n="vehicles.title">Автомобили</h1>
    </div>
    <div class="topbar-right">
        <span class="topbar-subtitle" data-i18n="vehicles.subtitle">Управление на автомобили</span>
        <div class="language-selector">
            <i class="fas fa-globe"></i>
            <select id="languageSelect" class="language-select" aria-label="Language selector">
                <option value="bg">Bulgarian</option>
                <option value="en">English</option>
            </select>
        </div>
        <button id="notificationBtn" class="notification-btn" data-i18n-title="notifications.title">
            <i class="fas fa-bell"></i>
            <span id="unreadBadge" class="notification-badge">0</span>
        </button>
        <button id="logoutBtn" class="topbar-logout" data-i18n-title="menu.profile">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </div>
</div>

<!-- Notification Center -->
<div id="notificationCenter" class="notification-center">
    <div class="notification-center-header">
        <h3 data-i18n="notifications.title">Уведомления</h3>
        <button id="closeNotificationCenter" class="close-notification-center" data-i18n-title="notifications.title">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div id="notificationList" class="notification-list">
        <div class="notification-empty" data-i18n="notifications.noNotifications">Няма нови уведомления</div>
    </div>
    <div class="notification-center-footer">
        <button id="markAllReadBtn" class="btn-mark-all-read" data-i18n="notifications.markAllRead">Маркирай всички като прочетени</button>
    </div>
</div>

<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <div class="logo">
            <i class="fas fa-shield-alt logo-icon"></i>
            <h2 data-i18n="common.brand">ГДПБЗН</h2>
        </div>
    </div>

    <nav class="sidebar-nav">
        <ul class="menu">
            <li class="menu-item" data-page="incidents">
                <i class="fas fa-bell"></i>
                <span data-i18n="menu.incidents">Произшествия</span>
            </li>
            <li class="menu-item" data-page="firefighters" data-admin-only="true">
                <i class="fas fa-person"></i>
                <span data-i18n="menu.firefighters">Пожарникари</span>
            </li>
            <li class="menu-item" data-page="teams">
                <i class="fas fa-users"></i>
                <span data-i18n="menu.teams">Екипи</span>
            </li>
            <li class="menu-item active" data-page="vehicles">
                <i class="fas fa-car"></i>
                <span data-i18n="menu.vehicles">Автомобили</span>
            </li>
            <li class="menu-item" data-page="profile">
                <i class="fas fa-id-badge"></i>
                <span data-i18n="menu.profile">Профил</span>
            </li>
        </ul>
    </nav>
</div>

<div class="content">
    <div class="dashboard-header">
        <div class="header-title">
            <h1 data-i18n="vehicles.title">Автомобили</h1>
            <p data-i18n="vehicles.description">Управление и преглед на автомобилния парк</p>
        </div>
        <button id="registerVehicleBtn" class="btn-add-primary" data-admin-only="true">
            <i class="fas fa-plus"></i> <span data-i18n="vehicles.registerButton">Регистрирай автомобил</span>
        </button>
    </div>

    <div class="vehicles-filters" data-admin-only="true">
        <div class="filter-group">
                <input type="text" id="vehicleSearch" placeholder="Търси по сигнал или номер на маса..." data-i18n-placeholder="vehicles.searchPlaceholder">
                <select id="vehicleStatusFilter">
                    <option value="" data-i18n="vehicles.filters.allStatuses">Всички статуси</option>
                    <option value="AVAILABLE" data-i18n="vehicles.filters.available">Disponibel</option>
                    <option value="ON_MISSION" data-i18n="vehicles.filters.onMission">На задача</option>
                    <option value="MAINTENANCE" data-i18n="vehicles.filters.maintenance">Поддържане</option>
                </select>
                <select id="vehicleTypeFilter">
                    <option value="" data-i18n="vehicles.filters.allTypes">Всички типове</option>
                    <option value="FIRE_TRUCK" data-i18n="vehicles.filters.fireTruck">Пожарен автомобил</option>
                    <option value="CISTERN" data-i18n="vehicles.filters.cistern">Цистерна</option>
                    <option value="SUPPORT" data-i18n="vehicles.filters.support">Подпомагащ</option>
    </div>

    <div class="vehicles-grid" id="vehiclesGrid">
        <div class="loading-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p data-i18n="vehicles.loading">Зареждане на автомобили...</p>
        </div>
    </div>
</div>

<!-- Register Vehicle Modal -->
<div id="registerVehicleModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2 data-i18n="vehicles.registerModalTitle">Регистрирай нов автомобил</h2>
            <button class="modal-close" onclick="closeRegisterVehicleModal()" data-i18n-title="vehicles.closeModal">&times;</button>
        </div>
        
        <form id="registerVehicleForm" class="modal-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="vehicleCallsign" data-i18n="vehicles.vehicleCallsignLabel">Сигнал*</label>
                    <input type="text" id="vehicleCallsign" required placeholder="Например: ПА-1" data-i18n-placeholder="vehicles.vehicleCallsignPlaceholder">
                </div>
                <div class="form-group">
                    <label for="vehiclePlate" data-i18n="vehicles.vehiclePlateLabel">Номер на маса*</label>
                    <input type="text" id="vehiclePlate" required placeholder="Например: СФ 1234 АА" data-i18n-placeholder="vehicles.vehiclePlatePlaceholder">
                </div>
            </div>

            <div class="form-group">
                <label for="vehicleType" data-i18n="vehicles.vehicleTypeLabel">Тип автомобил*</label>
                <select id="vehicleType" required>
                    <option value="" data-i18n="vehicles.vehicleTypePlaceholder">Избери тип</option>
                    <option value="FIRE_TRUCK" data-i18n="vehicles.vehicleTypeFireTruck">Пожарен автомобил</option>
                    <option value="CISTERN" data-i18n="vehicles.vehicleTypeCistern">Цистерна</option>
                    <option value="SUPPORT" data-i18n="vehicles.vehicleTypeSupport">Подпомагащ</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="vehicleWaterCapacity" data-i18n="vehicles.vehicleWaterCapacityLabel">Капацитет вода (литри)</label>
                    <input type="number" id="vehicleWaterCapacity" min="0" placeholder="Например: 2000" data-i18n-placeholder="vehicles.vehicleWaterCapacityPlaceholder">
                </div>
                <div class="form-group">
                    <label for="vehicleFoamCapacity" data-i18n="vehicles.vehicleFoamCapacityLabel">Капацитет пяна (литри)</label>
                    <input type="number" id="vehicleFoamCapacity" min="0" placeholder="Например: 500" data-i18n-placeholder="vehicles.vehicleFoamCapacityPlaceholder">
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeRegisterVehicleModal()" data-i18n="vehicles.cancelButton">Отмени</button>
                <button type="submit" class="btn-add-primary">
                    <i class="fas fa-save"></i> <span data-i18n="vehicles.submitButton">Регистрирай</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Vehicle Details Modal -->
<div id="vehicleDetailsModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2 data-i18n="vehicles.detailsModalTitle">Детайли на автомобила</h2>
            <button class="modal-close" onclick="closeVehicleDetailsModal()" data-i18n-title="vehicles.closeModal">&times;</button>
        </div>
        
        <div class="vehicle-details-content">
            <div class="details-grid">
                <div class="detail-item">
                    <label data-i18n="vehicles.detailLabelCallsign">Сигнал</label>
                    <p id="detailCallsign">-</p>
                </div>
                <div class="detail-item">
                    <label data-i18n="vehicles.detailLabelPlate">Номер на маса</label>
                    <p id="detailPlate">-</p>
                </div>
                <div class="detail-item">
                    <label data-i18n="vehicles.detailLabelType">Тип</label>
                    <p id="detailType">-</p>
                </div>
                <div class="detail-item">
                    <label data-i18n="vehicles.detailLabelStatus">Статус</label>
                    <p id="detailStatus">-</p>
                </div>
                <div class="detail-item">
                    <label data-i18n="vehicles.detailLabelWaterCapacity">Капацитет вода</label>
                    <p id="detailWaterCapacity">-</p>
                </div>
                <div class="detail-item">
                    <label data-i18n="vehicles.detailLabelFoamCapacity">Капацитет пяна</label>
                    <p id="detailFoamCapacity">-</p>
                </div>
                <div class="detail-item">
                    <label data-i18n="vehicles.detailLabelAssignedTeam">Назначен екип</label>
                    <p id="detailAssignedTeam">-</p>
                </div>
                <div class="detail-item">
                    <label data-i18n="vehicles.detailLabelLocation">Последна позиция</label>
                    <p id="detailLocation">-</p>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeVehicleDetailsModal()" data-i18n="vehicles.detailCloseButton">Затвори</button>
            </div>
        </div>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/language-selector.js"></script>
<script src="../js/vehicles.js"></script>
</body>
</html>
