<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="addIncident.title">Добави произшествие</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/add_incident.css">
    <link rel="stylesheet" href="../css/i18n.css">
</head>
<body>
    <div class="language-switcher-fixed">
        <label class="language-selector">
            <i class="fas fa-globe"></i>
            <select id="languageSelect" class="language-select" aria-label="Language selector">
                <option value="bg">Bulgarian</option>
                <option value="en">English</option>
            </select>
        </label>
    </div>

<div class="add-incident-container">
    <div class="add-incident-card">
        <div class="add-incident-header">
            <h1 data-i18n="addIncident.title">Добави ново произшествие</h1>
            <p data-i18n="addIncident.subtitle">Попълнете информацията за произшествието</p>
        </div>

        <form id="addIncidentForm" class="add-incident-form">
            <div class="form-group">
                <label for="incidentType" class="form-label">
                    <i class="fas fa-exclamation-triangle"></i> <span data-i18n="addIncident.typeLabel">Тип произшествие</span>
                </label>
                <select id="incidentType" name="type" class="form-control" required>
                    <option value="" data-i18n="addIncident.typePlaceholder">-- Избери тип --</option>
                    <option value="пожар" data-i18n="addIncident.typeFire">Пожар</option>
                    <option value="катастрофа" data-i18n="addIncident.typeAccident">Катастрофа</option>
                    <option value="спасяване" data-i18n="addIncident.typeRescue">Спасяване</option>
                    <option value="медицинска_помощ" data-i18n="addIncident.typeMedical">Медицинска помощ</option>
                    <option value="опасен_материал" data-i18n="addIncident.typeHazmat">Опасен материал</option>
                    <option value="загрижване" data-i18n="addIncident.typeConcern">Загрижване</option>
                    <option value="други" data-i18n="addIncident.typeOther">Други</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address" class="form-label">
                    <i class="fas fa-map-marker-alt"></i> <span data-i18n="addIncident.addressLabel">Адрес</span>
                </label>
                <input type="text" id="address" name="address" class="form-control" placeholder="Въведи адреса на произшествието" data-i18n-placeholder="addIncident.addressPlaceholder" required>
            </div>

            <div class="location-mode-toggle">
                <button type="button" class="mode-btn active" id="coordinatesModeBtn" data-mode="coordinates" data-i18n="addIncident.coordinatesMode">Координати</button>
                <button type="button" class="mode-btn" id="mapModeBtn" data-mode="map" data-i18n="addIncident.mapMode">Избери на карта</button>
            </div>

            <div id="coordinatesSection" class="location-section active">
                <div class="form-group">
                    <label for="latitude" class="form-label">
                        <i class="fas fa-compass"></i> <span data-i18n="addIncident.latitudeLabel">Широчина (GPS)</span>
                    </label>
                    <input type="number" id="latitude" name="latitude" class="form-control" placeholder="Напр. 42.6977" data-i18n-placeholder="addIncident.latitudePlaceholder" step="0.000001">
                </div>

                <div class="form-group">
                    <label for="longitude" class="form-label">
                        <i class="fas fa-compass"></i> <span data-i18n="addIncident.longitudeLabel">Дължина (GPS)</span>
                    </label>
                    <input type="number" id="longitude" name="longitude" class="form-control" placeholder="Напр. 23.3219" data-i18n-placeholder="addIncident.longitudePlaceholder" step="0.000001">
                </div>
            </div>

            <div id="mapSection" class="location-section">
                <div class="map-info">
                    <p><i class="fas fa-info-circle"></i> <span data-i18n="addIncident.mapInfo">Щракни на картата, за да избереш локацията на произшествието</span></p>
                </div>
                <div id="incidentMap" class="incident-map"></div>
                <div class="map-selected-coords">
                    <div class="coord-display">
                        <label data-i18n="addIncident.selectedLocation">Избрана локация:</label>
                        <span id="mapLatitude">--</span>, <span id="mapLongitude">--</span>
                    </div>
                    <button type="button" class="btn btn-small" id="useMapCoordsBtn" data-i18n="addIncident.useMapCoords">Използвай тази локация</button>
                </div>
            </div>

            <div class="form-group">
                <label for="description" class="form-label">
                    <i class="fas fa-align-left"></i> <span data-i18n="addIncident.descriptionLabel">Описание</span>
                </label>
                <textarea id="description" name="description" class="form-control" placeholder="Допълнителни детайли за произшествието" data-i18n-placeholder="addIncident.descriptionPlaceholder" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="teamId" class="form-label">
                    <i class="fas fa-users"></i> <span data-i18n="addIncident.assignTeamLabel">Назначи екип</span>
                </label>
                <select id="teamId" name="team_id" class="form-control">
                    <option value="" data-i18n="addIncident.teamPlaceholder">-- Избери екип (опционално) --</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-submit">
                    <i class="fas fa-check"></i> <span data-i18n="addIncident.submitButton">Добави произшествие</span>
                </button>
                <button type="button" class="btn btn-cancel" id="cancelBtn">
                    <i class="fas fa-times"></i> <span data-i18n="addIncident.cancelButton">Отмени</span>
                </button>
            </div>
        </form>

        <div id="successMessage" class="success-message" style="display: none;">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 data-i18n="addIncident.successTitle">Произшествие добавено</h2>
            <p id="successText" data-i18n="addIncident.successText">Произшествието е успешно регистрирано в системата.</p>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText" data-i18n="addIncident.errorText">Възникна грешка при добавяне на произшествието.</span>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/config.js"></script>
<script src="../js/language-selector.js"></script>
<script src="../js/add_incident.js"></script>

</body>
</html>
