<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="profile.title">Профил</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/i18n.css">
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <button id="menuBtn" class="menu-btn">
            <i class="fas fa-bars"></i>
        </button>
        <h1 class="topbar-title" data-i18n="profile.title">Профил</h1>
    </div>
    <div class="topbar-right">
        <span class="topbar-subtitle" data-i18n="profile.subtitle">Управление на профил</span>
        <div class="language-selector">
            <i class="fas fa-globe"></i>
            <select id="languageSelect" class="language-select" aria-label="Language selector">
                <option value="bg">Bulgarian</option>
                <option value="en">English</option>
            </select>
        </div>
        <button id="notificationBtn" class="notification-btn" data-i18n-title="notifications.title">
            <i class="fas fa-bell"></i>
            <span id="unreadBadge" class="notification-badge">0</span>
        </button>
        <button id="logoutBtn" class="topbar-logout" data-i18n-title="menu.profile">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </div>
</div>

<!-- Notification Center -->
<div id="notificationCenter" class="notification-center">
    <div class="notification-center-header">
        <h3 data-i18n="notifications.title">Уведомления</h3>
        <button id="closeNotificationCenter" class="close-notification-center" data-i18n-title="notifications.title">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div id="notificationList" class="notification-list">
        <div class="notification-empty" data-i18n="notifications.noNotifications">Няма нови уведомления</div>
    </div>
    <div class="notification-center-footer">
        <button id="markAllReadBtn" class="btn-mark-all-read" data-i18n="notifications.markAllRead">Маркирай всички като прочетени</button>
    </div>
</div>

<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <div class="logo">
            <i class="fas fa-shield-alt logo-icon"></i>
            <h2 data-i18n="common.brand">ГДПБЗН</h2>
        </div>
    </div>

    <nav class="sidebar-nav">
        <ul class="menu">
            <li class="menu-item" data-page="incidents">
                <i class="fas fa-bell"></i>
                <span data-i18n="menu.incidents">Произшествия</span>
            </li>
            <li class="menu-item" data-page="firefighters" data-admin-only="true">
                <i class="fas fa-person"></i>
                <span data-i18n="menu.firefighters">Пожарникари</span>
            </li>
            <li class="menu-item" data-page="teams">
                <i class="fas fa-users"></i>
                <span data-i18n="menu.teams">Екипи</span>
            </li>
            <li class="menu-item" data-page="vehicles">
                <i class="fas fa-fire-truck"></i>
                <span data-i18n="menu.vehicles">Автомобили</span>
            </li>
            <li class="menu-item active" data-page="profile">
                <i class="fas fa-id-badge"></i>
                <span data-i18n="menu.profile">Профил</span>
            </li>
        </ul>
    </nav>
</div>

<div class="content">
    <div class="dashboard-header">
        <div class="header-title">
            <h1 data-i18n="profile.myProfile">Моят профил</h1>
            <p data-i18n="profile.profileSubtitle">Промени твоите лични данни</p>
        </div>
    </div>

    <div class="panel-container">
        <div class="panel-header">
            <h2 data-i18n="profile.informationTitle">Профилна информация</h2>
        </div>
        <div class="panel-content">
            <form id="profileForm" class="profile-form">
                <div class="profile-grid">
                    <div class="form-group">
                        <label for="fullName" data-i18n="profile.fullName">Пълно име</label>
                        <input type="text" id="fullName" required data-i18n-placeholder="profile.fullNamePlaceholder" placeholder="Пълно име" />
                    </div>

                    <div class="form-group">
                        <label for="username" data-i18n="profile.username">Потребителско име</label>
                        <input type="text" id="username" required data-i18n-placeholder="profile.usernamePlaceholder" placeholder="Потребителско име" />
                    </div>

                    <div class="form-group">
                        <label for="phone" data-i18n="profile.phone">Телефон</label>
                        <input type="tel" id="phone" data-i18n-placeholder="profile.phonePlaceholder" placeholder="(по желание)" />
                    </div>


                    <div class="form-group">
                        <label for="role" data-i18n="profile.role">Роля</label>
                        <input type="text" id="role" disabled />
                    </div>

                    <div class="form-group" id="statusGroup" style="display:none;">
                        <label for="status" data-i18n="profile.status">Статус</label>
                        <select id="status">
                            <option value="on_duty" data-i18n="profile.statusOnDuty">На дежурство</option>
                            <option value="off_duty" data-i18n="profile.statusOffDuty">Извън дежурство</option>
                            <option value="on_mission" data-i18n="profile.statusOnMission">На задача</option>
                            <option value="vacation" data-i18n="profile.statusVacation">Отпуск</option>
                            <option value="sick_leave" data-i18n="profile.statusSickLeave">Болен</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="newPassword" data-i18n="profile.newPassword">Нова парола</label>
                        <input type="password" id="newPassword" data-i18n-placeholder="profile.passwordPlaceholder" placeholder="(остави празно за без промяна)" />
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" data-i18n="profile.confirmPassword">Потвърди парола</label>
                        <input type="password" id="confirmPassword" data-i18n-placeholder="profile.passwordPlaceholder" placeholder="(остави празно за без промяна)" />
                    </div>
                </div>

                <div class="profile-actions">
                    <button type="submit" class="btn-add-primary" id="saveProfileBtn">
                        <i class="fas fa-save"></i> <span data-i18n="profile.saveButton">Запази</span>
                    </button>
                </div>

                <div id="profileMessage" class="profile-message" style="display: none;"></div>
            </form>
        </div>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/language-selector.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>
